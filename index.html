  <div id="app"></div>
  <script>
    // ページごとのコンテンツ定義
    const homeContent = `

    </ul>
    </li>
    <h4>Movies</h4>
    <ul>
      <li><a href="https://www.imdb.com/title/tt1375666/">Inception</a></li>
      <li><a href="https://www.imdb.com/title/tt0816692/">Interstellar</a></li>
      <li><a href="https://www.imdb.com/title/tt0137523/">Fight Club</a></li>  
    </ul>
    </li>
    <li>
    <h4>Books</h4>
    <ul>
      <li><a href="https://www.goodreads.com/book/show/4671.The_Great_Gatsby">The Great Gatsby</a></li>
      <li><a href="https://www.goodreads.com/book/show/2657.To_Kill_a_Mockingbird">To Kill a Mockingbird</a></li>
      <li><a href="https://www.goodreads.com/book/show/1885.Pride_and_Prejudice">Pride and Prejudice</a></li>
    </ul>
    </li>
    </ul>
    <hr>
    <h3>Skills</h3>
    <ul>
      <li>C#</li>
      </ul>

    <h3>Portfolio</h3>
    <ul>
      <li><p><a href="https://shota1496.github.io/teatime/">Tea Time</a></p></li>
    <li><p><a href="https://script.google.com/macros/s/AKfycbxkWmOO2CCZWPg2HkZb6D73mqzwtwuCRVFu-wHGIav3q9vxldm5Qk-zoHGo-ZDUVIit3A/exec">今日の紅茶</a></p></li>

      <hr>
      <h3>Education</h3>
    <p>University of Tokyo, Computer Science</p>
    <h3>Experience</h3>
    <p>Internship at XYZ Company</p>
    <p>Part-time job at ABC Corporation</p>
    <p>Volunteer work at DEF Organization</p>
    <h3>Hobbies</h3>
    <p>Coding, Traveling, Cooking</p>
    <p>contacts or inquiries</p>
    <hr>
      `;
    const routes = {
      home: homeContent
      about: "<h2>About</h2><p>This is a simple Single Page Application (SPA) built with vanilla JavaScript. It demonstrates basic routing and dynamic content rendering without using any framework.</p>",
      contact: "<h2>Contact</h2><p><a href=\"mailto:shota_ishikuro@outlook.com\">Contact us</a></p>",
    };

    const themes = [
      {
        name: 'Neon',
        bg1: '#03040a',
        bg2: '#071025',
        cyan: '#67e8f9',
        pink: '#ff4fd8',
        lime: '#b5ff7d',
        text: '#e5f4ff',
        muted: '#b9d6ef',
        border: 'rgba(103, 232, 249, 0.22)',
      },
      {
        name: 'Sunset',
        bg1: '#120c0d',
        bg2: '#2b1016',
        cyan: '#fbbf24',
        pink: '#fb7185',
        lime: '#fca5a5',
        text: '#fff7ed',
        muted: '#fed7aa',
        border: 'rgba(251, 191, 36, 0.28)',
      },
      {
        name: 'Forest',
        bg1: '#071a14',
        bg2: '#112b22',
        cyan: '#6ee7b7',
        pink: '#34d399',
        lime: '#bbf7d0',
        text: '#ecfdf5',
        muted: '#d1fae5',
        border: 'rgba(110, 231, 183, 0.25)',
      }
    ];

    let themeIndex = 0;
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(index) {
      const theme = themes[index];
      document.documentElement.style.setProperty('--bg-1', theme.bg1);
      document.documentElement.style.setProperty('--bg-2', theme.bg2);
      document.documentElement.style.setProperty('--cyan', theme.cyan);
      document.documentElement.style.setProperty('--pink', theme.pink);
      document.documentElement.style.setProperty('--lime', theme.lime);
      document.documentElement.style.setProperty('--text', theme.text);
      document.documentElement.style.setProperty('--muted', theme.muted);
      document.documentElement.style.setProperty('--border', theme.border);
      themeToggle.textContent = `Color Mode: ${theme.name}`;
    }

    themeToggle.addEventListener('click', () => {
      themeIndex = (themeIndex + 1) % themes.length;
      applyTheme(themeIndex);
    });

    // ページ描画関数
    function renderPage() {
      const hash = location.hash.replace("#", "") || "home"; // デフォルトはhome
      const app = document.getElementById("app");

      // コンテンツ描画
      app.innerHTML = routes[hash] || "<h2>404</h2><p>Page not found</p>";

      // ナビゲーションのアクティブ表示
      document.querySelectorAll("nav a").forEach(a => {
        a.classList.toggle("active", a.getAttribute("href") === "#" + hash);
      });
    }

    // ハッシュ変更時にページ更新
    window.addEventListener("hashchange", renderPage);

    applyTheme(themeIndex);
    renderPage();
  </script>
</body>
</html>
