<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Dodger — Cyberpunk Mini Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="mast">
      <h1 class="logo">NEON DODGER</h1>
      <p class="sub">A tiny cyberpunk mini-game for mypage</p>
    </header>

    <main class="game-area">
      <canvas id="game" width="640" height="360"></canvas>
      <div class="hud">
        <button id="startBtn">Start</button>
        <span id="score">Score: 0</span>
      </div>
    </main>

    <footer class="credits">
      <small>Use arrow keys or A/D to move — Dodge the neon blocks</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
